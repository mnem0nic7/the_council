name: the-council-bluegreen

x-runtime-env: &runtime-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://council:council@postgres:5432/council}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  ARTIFACT_ROOT: /app/data/artifacts
  WORKSPACE_ROOT: /app/data/workspaces
  OBJECT_STORE_ENDPOINT: ${OBJECT_STORE_ENDPOINT:-minio:9000}
  OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-council}
  OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-council123}
  OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-council-artifacts}
  OBJECT_STORE_SECURE: ${OBJECT_STORE_SECURE:-false}
  JWT_SECRET: ${JWT_SECRET:-change-me}
  COUNCIL_OPERATOR_USERNAME: ${COUNCIL_OPERATOR_USERNAME:-captain}
  COUNCIL_OPERATOR_PASSWORD: ${COUNCIL_OPERATOR_PASSWORD:-bridge123}
  WEB_ORIGIN: ${PUBLIC_BASE_URL:-http://localhost}

x-web-build: &web-build
  context: ..
  dockerfile: apps/web/Dockerfile.prod
  args:
    NEXT_PUBLIC_RUNTIME_URL: /api/v1
    NEXT_PUBLIC_WS_URL: auto

services:
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
    environment:
      ACTIVE_COLOR: ${ACTIVE_COLOR:-blue}
    command: >-
      /bin/sh -lc
      "envsubst '$$ACTIVE_COLOR' < /etc/nginx/templates/active-upstream.conf.template >
      /etc/nginx/conf.d/active-upstream.conf &&
      exec nginx -g 'daemon off;'"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/active-upstream.conf.template:/etc/nginx/templates/active-upstream.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6

  web-blue:
    build: *web-build
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web-green:
    build: *web-build
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  runtime-blue:
    build:
      context: ../services/runtime
    restart: unless-stopped
    environment: *runtime-env
    expose:
      - "8000"
    volumes:
      - runtime-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  runtime-green:
    build:
      context: ../services/runtime
    restart: unless-stopped
    environment: *runtime-env
    expose:
      - "8000"
    volumes:
      - runtime-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-council}
      POSTGRES_USER: ${POSTGRES_USER:-council}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-council}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-council}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-council123}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  runtime-data:
  minio-data:
