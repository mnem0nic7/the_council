[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-council-runtime"
version = "0.1.0"
description = "Starship Agent Mission Control runtime"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.5",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic-settings>=2.6.1",
  "PyJWT>=2.10.0",
  "httpx>=0.27.2",
  "litellm>=1.52.9",
  "redis>=5.2.0",
  "minio>=7.2.12",
  "playwright>=1.49.0",
  "psycopg[binary]>=3.2.3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
